<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Larrey: SEO and AI search audit skill</title>
  <desc id="d">A vital-signs monitor: a heartbeat line becomes a rising trend, beside a triage panel ranking seven SEO systems by severity.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16212C" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="0.3" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#0E141B" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080B" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#3DDC97" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B0F14"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#vignette)"/>

  <text x="80" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#3DDC97">SEO + AI SEARCH AUDIT · AGENT SKILL</text>
  <text x="74" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#F2F5F8">Larrey</text>
  <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#A3B1BF">
    <tspan x="80" y="308">Treat your website like a patient.</tspan>
    <tspan x="80" y="346">Examine seven systems. Fix what's critical first.</tspan>
  </text>

  <path d="M0 500 H150 L165 488 L180 500 H215 L228 512 L246 420 L266 565 L282 500 H330 L350 482 L372 500 H450 L462 512 L478 450 L494 540 L508 500 C560 498 600 492 640 478 S740 452 800 440" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="800" cy="440" r="12" fill="none" stroke="#3DDC97" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="r" values="10;24;10" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="440" r="7" fill="#3DDC97" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="860" y="96" width="340" height="448" rx="18" fill="#101720" stroke="#1F2B38" stroke-width="2"/>
    <text x="892" y="140" font-size="15" letter-spacing="4" fill="#6B7C8F">TRIAGE</text>
    <text x="1168" y="140" font-size="15" text-anchor="end" fill="#6B7C8F">7 SYSTEMS</text>
    <line x1="892" y1="158" x2="1168" y2="158" stroke="#1F2B38" stroke-width="2"/>

    <rect x="878" y="174" width="304" height="38" rx="8" fill="#FF5A5F" fill-opacity="0.09"/>
    <text x="892" y="200" font-size="20" fill="#F2F5F8">TECHNICAL</text>
    <circle cx="1160" cy="193" r="8" fill="#FF5A5F" filter="url(#glow)"/>

    <text x="892" y="246" font-size="20" fill="#D7DEE6">ON-PAGE</text>
    <circle cx="1160" cy="239" r="8" fill="#FFB547"/>
    <text x="892" y="292" font-size="20" fill="#D7DEE6">AI SEARCH</text>
    <circle cx="1160" cy="285" r="8" fill="#FFB547"/>
    <text x="892" y="338" font-size="20" fill="#D7DEE6">CONTENT</text>
    <circle cx="1160" cy="331" r="8" fill="#3DDC97"/>
    <text x="892" y="384" font-size="20" fill="#D7DEE6">KEYWORDS</text>
    <circle cx="1160" cy="377" r="8" fill="#3DDC97"/>
    <text x="892" y="430" font-size="20" fill="#D7DEE6">ANALYTICS</text>
    <circle cx="1160" cy="423" r="8" fill="#3DDC97"/>
    <text x="892" y="476" font-size="20" fill="#8796A6">OFF-PAGE</text>
    <circle cx="1160" cy="469" r="8" fill="#5B6B7C"/>

    <g font-size="12" fill="#6B7C8F">
      <circle cx="894" cy="512" r="5" fill="#FF5A5F"/><text x="904" y="516">critical</text>
      <circle cx="974" cy="512" r="5" fill="#FFB547"/><text x="984" y="516">urgent</text>
      <circle cx="1050" cy="512" r="5" fill="#3DDC97"/><text x="1060" y="516">routine</text>
      <circle cx="1124" cy="512" r="5" fill="#5B6B7C"/><text x="1134" y="516">untested</text>
    </g>
  </g>

  <text x="80" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5F7184">$ npx skills add Prabhsingh0401/larrey-seo-audit</text>
  <text x="1200" y="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#5F7184">MIT · CLAUDE CODE · CODEX · CURSOR</text>
</svg>